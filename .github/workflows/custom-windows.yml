name: Custom server build.

# Builds the patched Telegram Desktop (hardcoded MTProto server) as a Release
# Windows x64 binary and uploads Telegram.exe as a downloadable artifact.
#
# Run it from the Actions tab ("Run workflow") or push to the custom-server
# branch. No local Visual Studio installation is required.
#
# The server address is an input: leave the fields empty to build the address
# compiled into Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp (the values
# below in DC_IP_DEFAULT / DC_PORT_DEFAULT, keep them in sync with the
# TDESKTOP_CUSTOM_DC_IP_DEFAULT / TDESKTOP_CUSTOM_DC_PORT_DEFAULT of
# Telegram/cmake/telegram_options.cmake, which is what really sets them).

on:
  workflow_dispatch:
    inputs:
      dc_ip:
        description: "Address of the MTProto server to hardcode. Empty = the built-in one."
        required: false
        default: ""
        type: string
      dc_port:
        description: "Port of the MTProto server. Empty = the built-in one."
        required: false
        default: ""
        type: string
      lock_dc_options:
        description: "Ignore the DC list the server reports in help.getConfig."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - custom-server

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows x64 Release
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      REPO_DIR: tdesktop
      # The fallback used when the dispatch form leaves the address empty (and
      # always on push builds), mirrors telegram_options.cmake.
      DC_IP_DEFAULT: "84.21.173.237"
      DC_PORT_DEFAULT: "20443"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Read the server address.
        shell: bash
        env:
          DC_IP_INPUT: ${{ inputs.dc_ip }}
          DC_PORT_INPUT: ${{ inputs.dc_port }}
          DC_LOCK_INPUT: ${{ inputs.lock_dc_options }}
        run: |
          set -euo pipefail

          DC_IP="$(printf '%s' "${DC_IP_INPUT:-$DC_IP_DEFAULT}" | tr -d '[:space:]')"
          DC_PORT="$(printf '%s' "${DC_PORT_INPUT:-$DC_PORT_DEFAULT}" | tr -d '[:space:]')"

          if ! printf '%s' "$DC_IP" | grep -Eq '^[0-9A-Za-z._:-]+$'; then
            echo "::error::dc_ip '$DC_IP' is not a plain IPv4/IPv6 address or hostname."
            exit 1
          fi
          if ! printf '%s' "$DC_PORT" | grep -Eq '^[0-9]+$' \
            || [ "$DC_PORT" -lt 1 ] || [ "$DC_PORT" -gt 65535 ]; then
            echo "::error::dc_port '$DC_PORT' is not a number from 1 to 65535."
            exit 1
          fi

          DC_LOCK_DEFINE=""
          if [ "${DC_LOCK_INPUT:-false}" = "true" ]; then
            DC_LOCK_DEFINE="-D TDESKTOP_CUSTOM_DC_LOCK=ON"
          fi

          echo "DC_IP=$DC_IP" >> "$GITHUB_ENV"
          echo "DC_PORT=$DC_PORT" >> "$GITHUB_ENV"
          echo "DC_LOCK_DEFINE=$DC_LOCK_DEFINE" >> "$GITHUB_ENV"
          {
            echo "### MTProto server baked into this build"
            echo ""
            echo "- Address: \`$DC_IP:$DC_PORT\`"
            echo "- help.getConfig DC list: $([ -n "$DC_LOCK_DEFINE" ] && echo ignored || echo honoured)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$REPO_DIR/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $REPO_DIR/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      # Unique key per run + prefix restore: every attempt saves whatever it
      # managed to build, and the next run resumes from the newest tree.
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ runner.arch }}-libs-rel-

      # No 'skip-release' here: the app is built in Release, so it needs the
      # Release flavour of openssl/tg_angle/ffmpeg/libavif/etc. Without it the
      # link step dies with LNK1181 (missing .lib) and LNK2038 (MT vs MTd).
      # Cost: both flavours are built, roughly 2.5h on a cold cache.
      #
      # The runner's Visual Studio is "18\Enterprise" and its ATL lives in
      # VC\Tools\MSVC\<ver>\atlmfc, while breakpad's generated dump_syms.vcxproj
      # hardcodes /I"$(VCInstallDir)VC\atlmfc\include" -- a path that does not
      # exist there. That used to kill the whole prepare with
      #   error C1083: Cannot open include file: 'atlbase.h'
      # so the dump_syms tool is not built at all (see the patch to
      # Telegram/build/prepare/prepare.py). It is only needed to produce .sym
      # files for crash reports, and those are disabled for this build.
      # One-time repair for caches saved by older runs of this workflow: they
      # contain the Qt cache_keys marker but not Libraries/win64/qt_6.11.2,
      # because the cleanup step used to delete that directory. prepare.py reads
      # the missing directory as "stage never built" and rebuilds Qt for
      # ~67 minutes, so recreate it empty -- the install prefix it produced is
      # still in the cache. No-op once the directory is there.
      - name: Repair the Qt stage directory.
        shell: bash
        continue-on-error: true
        run: |
          if [ -f Libraries/win64/cache_keys/qt_6.11.2 ] && [ ! -d Libraries/win64/qt_6.11.2 ]; then
            mkdir -p Libraries/win64/qt_6.11.2
            echo "Recreated the empty Qt build directory so prepare skips the stage."
          fi

      - name: Libraries.
        run: |
          %REPO_DIR%\Telegram\build\prepare\win.bat silent

      # Save the libraries immediately: a later build failure would otherwise
      # throw away hours of work, because cache post-steps are skipped when
      # the job fails. 'always()' also keeps a half-finished tree, and
      # prepare.py resumes from it (its own cache_keys mark finished stages).
      #
      # Careful: only the Qt *build* tree (Libraries/win64/qt_6.x, lowercase) is
      # expendable. The install prefix (Libraries/win64/Qt-6.x) must stay
      # byte-for-byte complete -- Qt6*Targets.cmake references every installed
      # *.obj by path and configure dies if one is gone:
      #   The imported target "Qt6::Gui_resources_1" references the file
      #   ".../objects-Debug/Gui_resources_1/.qt/rcc/qrc_qpdf_init.cpp.obj"
      #   but this file does not exist.
      # .pdb/.ilk are never referenced by those cmake files, so they are safe.
      #
      # The Qt build directory itself must survive, only its contents go:
      # prepare.py's checkCacheKey() treats the existence of
      # Libraries/win64/<stage> as proof that the stage was built, so deleting
      # qt_6.11.2 makes the next run rebuild Qt from scratch (~67 minutes).
      - name: Free up some disk space.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob dotglob
          for d in Libraries/win64/qt_*/; do
            rm -rf "${d}"* 2>/dev/null || true
          done
          find Libraries -type f \( -name '*.pdb' -o -name '*.ilk' \) -delete 2>/dev/null || true

      - name: Save Libraries cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: Libraries
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-rel-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save ThirdParty cache.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      # Cheap, and it answers the only question that matters when the build
      # dies with C1060/C3859/LNK1102: how much commit room was there.
      - name: Report memory and free space.
        shell: pwsh
        run: |
          Get-PSDrive C, D | ForEach-Object {
            '::notice title=Disk {0}::{1} GB free' -f $_.Name, [math]::Round($_.Free / 1GB, 1)
          }
          Get-CimInstance Win32_PageFileUsage | ForEach-Object {
            '::notice title=Pagefile::{0} {1} MB allocated, {2} MB in use' -f $_.Name, $_.AllocatedBaseSize, $_.CurrentUsage
          }
          $os = Get-CimInstance Win32_OperatingSystem
          '::notice title=Memory::physical {0} MB, free {1} MB' -f [math]::Round($os.TotalVisibleMemorySize / 1KB), [math]::Round($os.FreePhysicalMemory / 1KB)
          '::notice title=Commit limit::{0} MB, of which {1} MB is paging files' -f [math]::Round($os.TotalVirtualMemorySize / 1KB), [math]::Round($os.SizeStoredInPagingFiles / 1KB)

      - name: Configure.
        run: |
          echo Configuring the custom server as %DC_IP%:%DC_PORT%
          cd %REPO_DIR%\Telegram
          call configure.bat x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D TDESKTOP_CUSTOM_DC_IP=%DC_IP% ^
          -D TDESKTOP_CUSTOM_DC_PORT=%DC_PORT% %DC_LOCK_DEFINE%
          if errorlevel 1 exit /b 1
          rem The server address comes from the dispatch form (see the first
          rem step); an empty one falls back to the constants in
          rem mtproto_dc_options.cpp.
          rem Debug info is off on purpose: cl gets no /Zi and link gets no
          rem /DEBUG, so no multi-gigabyte Telegram.pdb is generated. Crash
          rem reports are disabled anyway, and building that PDB is what pushed
          rem link.exe past the runner's commit limit (LNK1102).
          rem Reported as an annotation so it is visible without the log dump.
          for /f "delims=" %%i in ('findstr /C:"GenerateDebugInformation" "%GITHUB_WORKSPACE%\%REPO_DIR%\out\Telegram\Telegram.vcxproj"') do echo ::notice title=DebugInfo::%%i
          exit /b 0

      # Fail in a couple of minutes instead of two hours later. The address used
      # to be passed as a -D macro with a quoted string value, and it got lost
      # somewhere between cmd, configure.py, cmake and msbuild: the client kept
      # the compiled-in fallback while the dispatch form said otherwise. Now
      # configure_file writes the literal into a header, and this step proves
      # the header holds exactly what was asked for.
      - name: Check the address reached the build.
        shell: bash
        run: |
          echo "--- CMake cache ---"
          grep -a "TDESKTOP_CUSTOM_DC" "$REPO_DIR/out/CMakeCache.txt" || true
          echo "--- generated header ---"
          cat "$REPO_DIR/out/custom_dc_config.h" || true
          echo "--- compiler include paths ---"
          grep -ao '<AdditionalIncludeDirectories>[^<]*' \
            "$REPO_DIR/out/Telegram/Telegram.vcxproj" | head -2 || true

          if [ ! -f "$REPO_DIR/out/custom_dc_config.h" ]; then
            echo "::error::custom_dc_config.h was not generated, telegram_options.cmake did not run."
            exit 1
          fi
          if ! grep -aqF "\"$DC_IP\"" "$REPO_DIR/out/custom_dc_config.h"; then
            echo "::error::the generated header does not carry $DC_IP, refusing to spend two hours on the wrong build."
            exit 1
          fi
          if ! grep -aqE "^#define TDESKTOP_CUSTOM_DC_PORT +$DC_PORT\$" "$REPO_DIR/out/custom_dc_config.h"; then
            echo "::error::the generated header does not carry port $DC_PORT."
            exit 1
          fi
          echo "$DC_IP:$DC_PORT is in the generated header."

      # The runner's paging file is small and fixed, so the whole job has a hard
      # commit limit. When it is reached the compiler reports:
      #
      #   error C3859: Failed to create virtual memory for PCH
      #   the system returned code 1455: The paging file is too small ...
      #   error C1060: compiler is out of heap space
      #
      # and the linker reports LNK1102. Two nodes is what fits: the Telegram
      # project compiles ~1900 sources against a very large PCH and each cl.exe
      # keeps a copy of it mapped, so four nodes (the default, one per core) blow
      # the limit about 90% into the build. The work is mostly serial inside the
      # single Telegram.vcxproj anyway, so the extra nodes only cover its
      # dependencies and cost little.
      #
      # Temp files go to D: as well: C: holds the paging file, and anything
      # written there makes it harder for Windows to grow it.
      - name: Build.
        env:
          TMP: D:\tmp
          TEMP: D:\tmp
        run: |
          if not exist D:\tmp mkdir D:\tmp
          cmake --build %REPO_DIR%\out --config Release --parallel 2
          if errorlevel 1 (
            echo.
            echo First attempt failed. Retrying with a single node: objects that
            echo were already built are reused, so only the files that died are
            echo compiled again.
            cmake --build %REPO_DIR%\out --config Release --parallel 1
            if errorlevel 1 exit /b 1
          )

      - name: Verify build output.
        shell: bash
        run: |
          EXE="$REPO_DIR/out/Release/Telegram.exe"
          ls -la "$REPO_DIR/out/Release" | head -40
          test -f "$EXE"
          ls -lh "$EXE"

          # The whole point of this build: the address has to be inside the
          # binary, otherwise it silently connects somewhere else. The bytes are
          # counted in python on purpose -- grep has its own opinion about
          # binary files, and a wrong verdict here costs two hours of build.
          cat > check_ip.py <<'PY'
          import re, sys

          path, ip = sys.argv[1], sys.argv[2]
          data = open(path, 'rb').read()
          hits = data.count(ip.encode())

          print(f'{ip} appears {hits} time(s) in {path}')
          if hits == 0:
              found = sorted(set(re.findall(rb'(?:\d{1,3}\.){3}\d{1,3}', data)))
              print('IPv4 addresses that are present instead:')
              for item in found[:20]:
                  print('   ', item.decode())
              sys.exit(1)
          PY

          if command -v python >/dev/null 2>&1; then PY=python; else PY=py; fi
          if ! "$PY" check_ip.py "$EXE" "$DC_IP"; then
            echo "::error::$DC_IP is not in Telegram.exe, the build is not what was asked for."
            exit 1
          fi

          echo "### Verified: \`$DC_IP:$DC_PORT\` is inside the binary" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p artifact
          printf '%s:%s\n' "$DC_IP" "$DC_PORT" > artifact/DC_ADDRESS.txt

      - name: Move artifact.
        run: |
          if not exist artifact mkdir artifact
          move %REPO_DIR%\out\Release\Telegram.exe artifact\

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: PlumeGram-Desktop-win64
          path: artifact\
          retention-days: 30
